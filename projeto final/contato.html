<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rota - Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <main class="page" id="inicio">
    <section class="hero section-card">
      <p class="eyebrow">Pagina interna</p>
      <h1>Contato e feedback</h1>
      <p class="hero-text">
        Canal para sugestoes e melhorias do sistema Rota usado no transporte universitario noturno.
      </p>
      <form class="form form-narrow section-top-gap">
        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Seu nome">
        <label for="mensagem" class="label-top-gap">Mensagem</label>
        <input id="mensagem" type="text" placeholder="Descreva seu feedback">
      </form>
      <!-- Botão de voltar removido, página será excluída -->
    </section>
  </main>
</body>
</html>
